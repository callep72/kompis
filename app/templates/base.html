<!DOCTYPE html>
<html lang="sv" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KOMPIS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-cpu"></i> KOMPIS
            </a>
            <button id="theme-toggle" class="btn btn-link nav-link px-2 ms-auto ms-lg-0" title="Växla mörkt/ljust läge">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'search' %}active{% endif %}" href="/search">
                            <i class="bi bi-search"></i> Sök
                        </a>
                    </li>
                    <li class="nav-item"><span class="nav-link text-muted px-1 d-none d-lg-inline">|</span></li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'components' %}active{% endif %}" href="/">
                            <i class="bi bi-grid"></i> Komponenter
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'locations' %}active{% endif %}" href="/locations">
                            <i class="bi bi-box"></i> Platser
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'categories' %}active{% endif %}" href="/categories">
                            <i class="bi bi-tags"></i> Kategorier
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'stock' %}active{% endif %}" href="/stock">
                            <i class="bi bi-exclamation-triangle"></i> Lågt lager
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
