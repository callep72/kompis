{% extends "base.html" %}
{% block title %}KOMPIS{% endblock %}

{% block head %}
<style>
  :root { --accent: #fd7e14; --accent-glow: rgba(253,126,20,0.22); }
  .search-hero {
    min-height: calc(100vh - 108px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 1rem 3rem;
    transition: min-height 0.35s ease, padding 0.35s ease;
  }
  .search-hero.compact {
    min-height: unset;
    justify-content: flex-start;
    padding: 1.5rem 1rem 0;
  }
  #hero-brand {
    text-align: center;
    margin-bottom: 2rem;
    transition: opacity 0.2s ease, max-height 0.35s ease;
    max-height: 120px;
    overflow: hidden;
  }
  #hero-brand.hidden {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    pointer-events: none;
  }
  .search-form {
    width: 100%;
    max-width: 680px;
  }
  .search-pill {
    display: flex;
    align-items: center;
    background: var(--bs-body-bg);
    border: 1.5px solid var(--bs-border-color);
    border-radius: 9999px;
    padding: 0.55rem 0.65rem 0.55rem 1.25rem;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .search-pill:focus-within {
    box-shadow: 0 4px 24px var(--accent-glow);
    border-color: var(--accent);
  }
  .search-pill .si {
    color: var(--bs-secondary-color);
    margin-right: 0.75rem;
    flex-shrink: 0;
    font-size: 1.1rem;
  }
  #ask-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 1rem;
    color: var(--bs-body-color);
    min-width: 0;
  }
  #ask-input::placeholder { color: var(--bs-secondary-color); }
  .search-submit {
    border: none;
    background: none;
    padding: 0.1rem 0.3rem;
    color: var(--accent);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    border-radius: 50%;
    transition: color 0.15s;
  }
  .search-submit:hover { color: #c96200; }
  .search-submit:disabled { color: var(--bs-secondary-color); cursor: default; }
  .result-card {
    border: 1px solid var(--bs-border-color);
    border-radius: 0.75rem;
    transition: box-shadow 0.15s, border-color 0.15s;
    background-color: var(--bs-secondary-bg);
  }
  .result-card:hover {
    box-shadow: 0 4px 20px var(--accent-glow);
    border-color: var(--accent);
  }
  .specs-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.1rem 1rem;
    font-size: 0.85rem;
  }
  .specs-key { color: var(--bs-secondary-color); white-space: nowrap; }
  .specs-val { font-family: var(--bs-font-monospace); }
  .answer-box {
    background: var(--bs-secondary-bg);
    border: 1px solid var(--bs-border-color);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    line-height: 1.6;
  }
  .answer-table tr.row-linked {
    cursor: pointer;
  }
  .answer-table tr.row-linked:hover td {
    color: #fd7e14;
  }
  @keyframes card-flash {
    0%   { box-shadow: 0 0 0 3px var(--accent-glow); border-color: var(--accent); }
    100% { box-shadow: none; border-color: var(--bs-border-color); }
  }
  .card-flash .result-card {
    animation: card-flash 1.4s ease-out forwards;
  }
</style>
{% endblock %}

{% block content %}
<div id="search-hero" class="search-hero">

  <div id="hero-brand">
    <div class="display-6 fw-bold text-body-emphasis mb-1">
      <i class="bi bi-cpu"></i> KOMPIS
    </div>
    <p class="text-secondary mb-0">Sök naturligt i ditt komponentlager</p>
  </div>

  <form id="ask-form" class="search-form">
    <div class="search-pill">
      <i class="bi bi-search si"></i>
      <input
        id="ask-input"
        type="text"
        placeholder="T.ex. 'NPN-transistorer för 200 V' eller 'nixie-drivare'"
        autocomplete="off"
        autofocus
      >
      <button id="search-btn" class="search-submit" type="submit" title="Sök">
        <i class="bi bi-arrow-right-circle-fill"></i>
      </button>
    </div>
  </form>

</div>

<div id="main-results" class="d-none" style="max-width:860px; margin:0 auto;">
  <div id="status" class="d-none text-secondary mb-3 d-flex align-items-center gap-2">
    <div class="spinner-border spinner-border-sm"></div>
    <span>Frågar Claude…</span>
  </div>
  <div id="answer" class="answer-box mb-4 d-none"></div>
  <div id="component-cards" class="row g-3"></div>
  <div id="token-usage" class="mt-3 text-secondary small text-end d-none"></div>
</div>

<div id="error-msg" class="d-none alert alert-danger mt-3" style="max-width:860px; margin:0 auto;"></div>

<script>
// Preload all component symbols
const _symbols = {};
const _symbolNames = [
  'npn','pnp','darlington','mosfet',
  'logic_and_2in','logic_and_3in','logic_and_4in',
  'logic_nand_2in','logic_nand_3in','logic_nand_4in',
  'logic_nor_2in','logic_nor_3in','logic_nor_4in',
  'logic_xor_2in','logic_xor_3in','logic_xor_4in',
  'logic_xnor_2in',
  'logic_inverter','logic_buffer',
];
const _symbolsReady = Promise.all(_symbolNames.map(async (t) => {
    try {
      const r = await fetch(`/symbols/${t}.svg`);
      if (r.ok) _symbols[t] = await r.text();
    } catch {}
}));

async function _symbolSvg(name) {
  if (!name) return null;
  if (_symbols[name]) return _symbols[name];
  try {
    const r = await fetch(`/symbols/${name}.svg`);
    if (!r.ok) return null;
    _symbols[name] = await r.text();
    return _symbols[name];
  } catch {
    return null;
  }
}

const _SKIP = /flip.flop|vippa|\bjk\b|shift.register|counter|räknare|\blatch\b|register|comparator|komparator|\bmux\b|multiplexer|encoder|decoder|transceiver|selector|select/i;

function _hasGate(text, gate) {
  return new RegExp(`\\b${gate}\\b|\\b${gate}.gate\\b|\\b${gate}.grind\\b`, 'i').test(text);
}

function _gateInputs(text, gate) {
  if (/\b4(?:[- .]?input|[- .]?ingång)/.test(text)) return 4;
  if (/\b3(?:[- .]?input|[- .]?ingång)/.test(text)) return 3;
  if (['nand','nor'].includes(gate) && /\btriple\b/.test(text)) return 3;
  return 2;
}

function _componentSymbol(c) {
  // Transistors
  const cat = ((c.category || {}).slug || '').toLowerCase();
  if (cat.includes('transistor')) {
    const tags = (c.tags || []).map(t => t.toLowerCase());
    const type = ((c.specs || {}).type || '').toUpperCase();
    if (tags.includes('darlington')) return {name:'darlington', label:null};
    if (tags.some(t => t.includes('mosfet') || t === 'fet') || (c.specs || {}).gate)
      return {name:'mosfet', label:null};
    if (type === 'NPN') return {name:'npn', label:null};
    if (type === 'PNP') return {name:'pnp', label:null};
    return null;
  }

  // Logic gates (no category restriction – rely on keywords + skip list)
  const text = [c.name, ...(c.tags || [])].join(' ').toLowerCase();
  if (_SKIP.test(text)) return null;

  let gate = null;
  if (_hasGate(text, 'nand'))      gate = 'nand';
  else if (_hasGate(text, 'xnor')) gate = 'xnor';
  else if (_hasGate(text, 'xor'))  gate = 'xor';
  else if (_hasGate(text, 'nor'))  gate = 'nor';
  else if (_hasGate(text, 'and'))  gate = 'and';
  else if (/\binverter\b/.test(text)) gate = 'inverter';
  else if (/\bbuffer\b/.test(text))   gate = 'buffer';
  if (!gate) return null;

  let inputs = 2;
  if (['and','nand','nor','xor','xnor'].includes(gate)) {
    inputs = gate === 'xnor' ? 2 : _gateInputs(text, gate);
  }

  const count = /\boctal\b/.test(text) ? 8 : /\bhex\b/.test(text) ? 6 :
                /\bquad\b/.test(text) ? 4 : /\btriple\b/.test(text) ? 3 :
                /\bdual\b/.test(text) ? 2 : null;

  const svgName = ['and','nand','nor','xor','xnor'].includes(gate)
    ? `logic_${gate}_${inputs}in` : `logic_${gate}`;
  const label = count && count > 1 ? `x${count}` : null;
  return {name: svgName, label};
}

const form = document.getElementById('ask-form');
const input = document.getElementById('ask-input');
const btn = document.getElementById('search-btn');
const hero = document.getElementById('search-hero');
const heroBrand = document.getElementById('hero-brand');
const mainResults = document.getElementById('main-results');
const status = document.getElementById('status');
const answerEl = document.getElementById('answer');
const cardsEl = document.getElementById('component-cards');
const tokenEl = document.getElementById('token-usage');
const errorEl = document.getElementById('error-msg');

let hasSearched = false;

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  // Transition to compact mode on first search
  if (!hasSearched) {
    hasSearched = true;
    heroBrand.classList.add('hidden');
    hero.classList.add('compact');
  }

  // Reset
  cardsEl.innerHTML = '';
  answerEl.innerHTML = '';
  answerEl.classList.add('d-none');
  tokenEl.classList.add('d-none');
  errorEl.classList.add('d-none');
  mainResults.classList.remove('d-none');
  status.classList.remove('d-none');
  btn.disabled = true;

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question}),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    const data = await resp.json();

    if (data.answer) {
      answerEl.innerHTML = formatAnswer(data.answer);
      answerEl.classList.remove('d-none');
    }

    if (data.components && data.components.length > 0) {
      const byId = {};
      data.components.forEach(c => byId[c.id] = c);
      const mentioned = data.components
        .filter(c => data.answer.includes(c.name) || (c.part_number && data.answer.includes(c.part_number)))
        .map(c => c.id);
      const ordered = mentioned.length > 0
        ? mentioned.map(id => byId[id]).filter(Boolean)
        : data.components;
      for (const c of ordered) {
        cardsEl.insertAdjacentHTML('beforeend', await renderCard(c));
      }
      linkTableRows(data.components);
    }

    if (data.usage) {
      tokenEl.textContent = `Tokens: ${fmt(data.usage.input_tokens)} in / ${fmt(data.usage.output_tokens)} ut`;
      tokenEl.classList.remove('d-none');
    }
  } catch (err) {
    errorEl.textContent = 'Något gick fel: ' + err.message;
    errorEl.classList.remove('d-none');
  } finally {
    status.classList.add('d-none');
    btn.disabled = false;
  }
});

function fmt(n) { return n.toLocaleString('sv'); }

function inlineFormat(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

function formatAnswer(text) {
  const lines = text.split('\n');
  const out = [];
  let tableRows = [];

  function flushTable() {
    if (!tableRows.length) return;
    let html = '<div class="table-responsive my-2"><table class="table table-sm table-hover mb-0 small answer-table">';
    tableRows.forEach((cells, i) => {
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag} class="py-1">${inlineFormat(c)}</${tag}>`).join('') + '</tr>';
    });
    html += '</table></div>';
    out.push(html);
    tableRows = [];
  }

  for (const raw of lines) {
    const line = raw.trim();
    if (/^\|/.test(line)) {
      if (/^[\|\s\-:]+$/.test(line)) continue; // separator row
      tableRows.push(line.split('|').slice(1, -1).map(c => c.trim()));
    } else {
      flushTable();
      if (/^##\s+/.test(line)) {
        out.push(`<p class="fw-semibold mb-1 mt-3">${inlineFormat(line.replace(/^##\s+/,''))}</p>`);
      } else if (/^#\s+/.test(line)) {
        out.push(`<p class="fw-bold mb-1 mt-2">${inlineFormat(line.replace(/^#\s+/,''))}</p>`);
      } else if (/^[-*]\s+/.test(line)) {
        out.push(`<div class="ms-2 mb-1">• ${inlineFormat(line.replace(/^[-*]\s+/,''))}</div>`);
      } else if (line === '') {
        out.push('<div class="mb-2"></div>');
      } else {
        out.push(`<p class="mb-1">${inlineFormat(line)}</p>`);
      }
    }
  }
  flushTable();
  return out.join('');
}

function linkTableRows(components) {
  const lookup = {};
  components.forEach(c => {
    lookup[c.name.toLowerCase()] = c.id;
    if (c.part_number) lookup[c.part_number.toLowerCase()] = c.id;
  });

  answerEl.querySelectorAll('.answer-table tr').forEach((row, i) => {
    if (i === 0) return; // header
    let matchId = null;
    row.querySelectorAll('td').forEach(td => {
      const t = td.textContent.trim().toLowerCase();
      if (lookup[t]) matchId = lookup[t];
    });
    if (matchId) {
      row.classList.add('row-linked');
      row.title = 'Hoppa till komponentkortet';
      row.addEventListener('click', () => {
        const target = document.getElementById(`comp-${matchId}`);
        if (!target) return;
        target.scrollIntoView({behavior: 'smooth', block: 'center'});
        target.classList.remove('card-flash');
        void target.offsetWidth; // reflow to restart animation
        target.classList.add('card-flash');
        setTimeout(() => target.classList.remove('card-flash'), 1500);
      });
    }
  });
}

function _packageValue(c) {
  const specs = c.specs || {};
  return specs.package || specs.Package || specs.pkg || null;
}

function _packageIcon(c) {
  const raw = _packageValue(c);
  if (!raw) return '';
  const pkg = String(raw).trim().toUpperCase();
  const pins = parseInt((pkg.match(/(?:DIP|SO|SOP|SOIC|TSSOP|SSOP)[- ]?(\d+)/) || [])[1] || (c.specs || {}).pins || '', 10);

  if (/^DIP/.test(pkg) || /^PDIP/.test(pkg)) return _dipIcon(pkg, Number.isFinite(pins) ? pins : null, false);
  if (/^(SO|SOP|SOIC|TSSOP|SSOP)/.test(pkg)) return _dipIcon(pkg, Number.isFinite(pins) ? pins : null, true);
  if (/^TO[- ]?220/.test(pkg)) return _toIcon(pkg, '220');
  if (/^TO[- ]?92/.test(pkg)) return _toIcon(pkg, '92');
  if (/^TO[- ]?66/.test(pkg)) return _toIcon(pkg, '66');
  return _packageBadge(pkg);
}

function _packageFrame(pkg, svg) {
  return `<div class="package-symbol" title="${pkg}" style="width:76px;height:90px;flex-shrink:0;opacity:0.82">${svg}</div>`;
}

function _dipIcon(pkg, pins, smd) {
  const label = pins ? `${smd ? 'SO' : 'DIP'}-${pins}` : pkg;
  const perSide = pins ? Math.min(Math.ceil(pins / 2), 20) : 7;
  const pitch = 70 / Math.max(perSide - 1, 1);
  const leftPins = Array.from({length: perSide}, (_, i) => {
    const y = 15 + i * pitch;
    return smd
      ? `<rect x="4" y="${y - 2.2}" width="12" height="4.4" rx="1"/>`
      : `<line x1="6" y1="${y}" x2="23" y2="${y}"/>`;
  }).join('');
  const rightPins = Array.from({length: perSide}, (_, i) => {
    const y = 15 + i * pitch;
    return smd
      ? `<rect x="84" y="${y - 2.2}" width="12" height="4.4" rx="1"/>`
      : `<line x1="77" y1="${y}" x2="94" y2="${y}"/>`;
  }).join('');
  const svg = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        ${leftPins}${rightPins}
        <rect x="22" y="8" width="56" height="84" rx="${smd ? 4 : 7}"/>
        <path d="M42 8 A8 8 0 0 0 58 8"/>
      </g>
      <text fill="currentColor" x="50" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">${label}</text>
    </svg>`;
  return _packageFrame(pkg, svg);
}

function _toIcon(pkg, kind) {
  const label = `TO-${kind}`;
  const body = kind === '92'
    ? '<path d="M30 54 A20 20 0 0 1 70 54 V72 H30 Z"/>'
    : kind === '66'
      ? '<path d="M25 33 H75 L84 50 L75 67 H25 L16 50 Z"/><circle cx="28" cy="50" r="5"/><circle cx="72" cy="50" r="5"/>'
      : '<rect x="25" y="14" width="50" height="58" rx="4"/><circle cx="50" cy="29" r="7"/>';
  const legs = kind === '92'
    ? '<line x1="40" y1="72" x2="40" y2="94"/><line x1="50" y1="72" x2="50" y2="94"/><line x1="60" y1="72" x2="60" y2="94"/>'
    : '<line x1="38" y1="72" x2="34" y2="94"/><line x1="50" y1="72" x2="50" y2="94"/><line x1="62" y1="72" x2="66" y2="94"/>';
  const svg = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        ${body}${legs}
      </g>
      <text fill="currentColor" x="50" y="${kind === '92' ? 49 : 59}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">${label}</text>
    </svg>`;
  return _packageFrame(pkg, svg);
}

function _packageBadge(pkg) {
  const svg = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="10" y="24" width="80" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
      <text fill="currentColor" x="50" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">${pkg}</text>
    </svg>`;
  return _packageFrame(pkg, svg);
}

async function renderCard(c) {
  const datasheet = (c.files || []).find(f => f.file_type === 'datasheet');
  const pdfBtn = datasheet
    ? `<a href="/files/${datasheet.filepath}" target="_blank"
          class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 text-nowrap">
         <i class="bi bi-file-earmark-pdf-fill"></i> Datablad
       </a>`
    : '';

  const mfr = [c.manufacturer, c.part_number].filter(Boolean).join(' · ');

  const catBadge = c.category
    ? `<span class="badge" style="background:var(--accent-glow,rgba(253,126,20,.18));color:var(--accent,#fd7e14);border:1px solid rgba(253,126,20,.35)">${c.category.name}</span>`
    : '';

  const sym = _componentSymbol(c);
  const svg = sym ? await _symbolSvg(sym.name) : null;
  const symHtml = sym && svg
    ? `<div class="d-flex align-items-center gap-2" style="flex-shrink:0;opacity:0.85">
         <div class="component-symbol" style="width:90px;height:90px">${svg}</div>
         ${sym.label ? `<span class="fw-semibold text-secondary" style="font-size:1rem;line-height:1">${sym.label}</span>` : ''}
       </div>`
    : '';
  const packageHtml = _packageIcon(c);
  const visualHtml = packageHtml || symHtml
    ? `<div class="d-flex align-items-center gap-2 ms-3" style="flex-shrink:0">${packageHtml}${symHtml}</div>`
    : '';

  const specs = Object.entries(c.specs || {});
  const specsHtml = specs.length
    ? `<div class="d-flex align-items-start">
        <div class="specs-grid mt-2 mb-1 flex-grow-1">
          ${specs.map(([k,v]) =>
            `<span class="specs-key">${k}</span><span class="specs-val">${v}</span>`
          ).join('')}
        </div>
        ${visualHtml}
       </div>`
    : visualHtml ? `<div class="mt-2 d-flex justify-content-end">${visualHtml}</div>` : '';

  const stockHtml = (c.stock || []).length
    ? (c.stock || []).map(s => {
        const loc = [s.drawer, s.compartment].filter(Boolean).join(' › ');
        return `<span class="badge bg-success bg-opacity-75 me-1" style="font-size:1rem;padding:0.4em 0.7em"><i class="bi bi-box me-1"></i>${loc || '–'}</span>`;
      }).join('')
    : `<span class="text-secondary small">Inget lager registrerat</span>`;

  const tagsHtml = (c.tags || []).map(t =>
    `<span class="badge rounded-pill border border-secondary text-body fw-normal me-1 mb-1">${t}</span>`
  ).join('');

  return `
    <div class="col-12" id="comp-${c.id}">
      <div class="card result-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div class="flex-grow-1 min-width-0">
              <h5 class="mb-0 d-flex align-items-center gap-2 flex-wrap">
                <a href="/components/${c.id}" class="text-decoration-none text-body-emphasis fw-semibold">${c.name}</a>
                ${catBadge}
              </h5>
              ${mfr ? `<div class="text-secondary small mt-1">${mfr}</div>` : ''}
            </div>
            ${pdfBtn ? `<div class="flex-shrink-0">${pdfBtn}</div>` : ''}
          </div>
          ${c.description ? `<p class="small mt-2 mb-1">${c.description}</p>` : ''}
          ${specsHtml}
          <div class="mt-2">${stockHtml}</div>
          ${tagsHtml ? `<div class="mt-2">${tagsHtml}</div>` : ''}
        </div>
      </div>
    </div>`;
}
</script>
{% endblock %}
