{% extends "base.html" %}
{% block title %}KOMPIS{% endblock %}

{% block head %}
<style>
  :root { --accent: #fd7e14; --accent-glow: rgba(253,126,20,0.22); }
  .search-hero {
    min-height: calc(100vh - 108px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 1rem 3rem;
    transition: min-height 0.35s ease, padding 0.35s ease;
  }
  .search-hero.compact {
    min-height: unset;
    justify-content: flex-start;
    padding: 1.5rem 1rem 0;
  }
  #hero-brand {
    text-align: center;
    margin-bottom: 2rem;
    transition: opacity 0.2s ease, max-height 0.4s ease;
    max-height: 700px;
    overflow: hidden;
  }
  .cabinet-img {
    width: 200px;
    height: auto;
    opacity: 0.82;
    transition: opacity 0.3s;
    display: block;
    margin: 0 auto 1.5rem;
  }
  .cabinet-img:hover { opacity: 1; }
  [data-bs-theme="light"] .cabinet-img {
    filter: brightness(0) opacity(0.3);
  }
  #hero-brand.hidden {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    pointer-events: none;
  }
  .search-form {
    width: 100%;
    max-width: 680px;
  }
  .search-pill {
    display: flex;
    align-items: center;
    background: var(--bs-body-bg);
    border: 1.5px solid var(--bs-border-color);
    border-radius: 9999px;
    padding: 0.55rem 0.65rem 0.55rem 1.25rem;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .search-pill:focus-within {
    box-shadow: 0 4px 24px var(--accent-glow);
    border-color: var(--accent);
  }
  .search-pill .si {
    color: var(--bs-secondary-color);
    margin-right: 0.75rem;
    flex-shrink: 0;
    font-size: 1.1rem;
  }
  #ask-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 1rem;
    color: var(--bs-body-color);
    min-width: 0;
  }
  #ask-input::placeholder { color: var(--bs-secondary-color); }
  .search-submit {
    border: none;
    background: none;
    padding: 0.1rem 0.3rem;
    color: var(--accent);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    border-radius: 50%;
    transition: color 0.15s;
  }
  .search-submit:hover { color: #c96200; }
  .search-submit:disabled { color: var(--bs-secondary-color); cursor: default; }
  .result-card {
    border: 1px solid var(--bs-border-color);
    border-radius: 0.75rem;
    transition: box-shadow 0.15s, border-color 0.15s;
    background-color: var(--bs-secondary-bg);
  }
  .result-card:hover {
    box-shadow: 0 4px 20px var(--accent-glow);
    border-color: var(--accent);
  }
  .specs-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.1rem 1rem;
    font-size: 0.85rem;
  }
  .specs-key { color: var(--bs-secondary-color); white-space: nowrap; }
  .specs-val { font-family: var(--bs-font-monospace); }
  .answer-box {
    background: var(--bs-secondary-bg);
    border: 1px solid var(--bs-border-color);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    line-height: 1.6;
  }
  .answer-table tr.row-linked {
    cursor: pointer;
  }
  .answer-table tr.row-linked:hover td {
    color: #fd7e14;
  }
  @keyframes card-flash {
    0%   { box-shadow: 0 0 0 3px var(--accent-glow); border-color: var(--accent); }
    100% { box-shadow: none; border-color: var(--bs-border-color); }
  }
  .card-flash .result-card {
    animation: card-flash 1.4s ease-out forwards;
  }
</style>
{% endblock %}

{% block content %}

<!-- Hero – visas bara innan första sökning -->
<div id="search-hero" class="search-hero">
  <div id="hero-brand">
    <img class="cabinet-img" id="cabinet-btn"
         src="/symbols/cabinet_15_drawers_light_lines.svg"
         alt="Komponentskåp"
         style="cursor:pointer" title="Bläddra i lådorna">
    <p class="small mb-3" style="color:var(--accent);cursor:pointer" id="browse-btn">
      <i class="bi bi-grid-3x3-gap me-1"></i>Kika i kabinettets lådor eller sök!
    </p>
    <div class="display-6 fw-bold text-body-emphasis mb-1">
      <i class="bi bi-cpu"></i> KOMPIS
    </div>
    <p class="text-secondary mb-0">Sök naturligt i ditt komponentlager</p>
  </div>
  <form id="ask-form" class="search-form">
    <div class="search-pill">
      <i class="bi bi-search si"></i>
      <input id="ask-input" type="text"
             placeholder="T.ex. 'NPN-transistorer för 200 V' eller 'nixie-drivare'"
             autocomplete="off" autofocus>
      <button id="search-btn" class="search-submit" type="submit" title="Sök">
        <i class="bi bi-arrow-right-circle-fill"></i>
      </button>
    </div>
  </form>
</div>

<!-- Chattvy – visas efter första sökning -->
<div id="chat-view" class="d-none" style="max-width:860px;margin:0 auto;padding-bottom:2rem">

  <!-- Ackumulerade utbyten -->
  <div id="chat-exchanges"></div>

  <!-- Spinner -->
  <div id="status" class="d-none text-secondary my-3 d-flex align-items-center gap-2">
    <div class="spinner-border spinner-border-sm"></div>
    <span>Frågar AI…</span>
  </div>

  <!-- Felmeddelande -->
  <div id="error-msg" class="d-none alert alert-danger"></div>

  <!-- Sökruta längst ner -->
  <div id="chat-bar" class="mt-4 pt-3" style="border-top:1px solid var(--bs-border-color-translucent)">
    <div class="search-form" style="max-width:680px;margin:0 auto">
      <div class="search-pill" style="align-items:flex-end">
        <i class="bi bi-search si" style="margin-bottom:0.3rem"></i>
        <textarea id="chat-input"
                  placeholder="Ställ en följdfråga eller ny sökning…"
                  autocomplete="off" rows="1"
                  style="flex:1;border:none;outline:none;background:transparent;
                         font-size:1rem;color:var(--bs-body-color);min-width:0;
                         resize:none;overflow:hidden;line-height:1.5;
                         padding:0;max-height:10rem;overflow-y:auto"></textarea>
        <button id="chat-btn" class="search-submit" style="margin-bottom:0.1rem" title="Skicka">
          <i class="bi bi-arrow-right-circle-fill"></i>
        </button>
      </div>
      <div class="text-center mt-2 small text-secondary">
        <i class="bi bi-chat-dots me-1"></i>Konversation pågår –
        <button type="button" onclick="resetConversation()"
                class="btn btn-link btn-sm p-0 text-secondary text-decoration-underline">
          börja om
        </button>
      </div>
    </div>
  </div>

</div>

<script>
// Preload all component symbols
const _symbols = {};
const _symbolNames = [
  'npn','pnp','darlington','mosfet',
  'logic_and_2in','logic_and_3in','logic_and_4in',
  'logic_nand_2in','logic_nand_3in','logic_nand_4in',
  'logic_nor_2in','logic_nor_3in','logic_nor_4in',
  'logic_xor_2in','logic_xor_3in','logic_xor_4in',
  'logic_xnor_2in',
  'logic_inverter','logic_buffer',
];
const _symbolsReady = Promise.all(_symbolNames.map(async (t) => {
    try {
      const r = await fetch(`/symbols/${t}.svg`);
      if (r.ok) _symbols[t] = await r.text();
    } catch {}
}));

async function _symbolSvg(name) {
  if (!name) return null;
  if (_symbols[name]) return _symbols[name];
  try {
    const r = await fetch(`/symbols/${name}.svg`);
    if (!r.ok) return null;
    _symbols[name] = await r.text();
    return _symbols[name];
  } catch {
    return null;
  }
}

const _packageSymbols = {};

async function _packageSvg(name) {
  if (!name) return null;
  if (_packageSymbols[name]) return _packageSymbols[name];
  try {
    const r = await fetch(`/symbols/${name}.svg`);
    if (!r.ok) return null;
    _packageSymbols[name] = await r.text();
    return _packageSymbols[name];
  } catch {
    return null;
  }
}

const _SKIP = /flip.flop|vippa|\bjk\b|shift.register|counter|räknare|\blatch\b|register|comparator|komparator|\bmux\b|multiplexer|encoder|decoder|transceiver|selector|select/i;

function _hasGate(text, gate) {
  return new RegExp(`\\b${gate}\\b|\\b${gate}.gate\\b|\\b${gate}.grind\\b`, 'i').test(text);
}

function _gateInputs(text, gate) {
  if (/\b4(?:[- .]?input|[- .]?ingång)/.test(text)) return 4;
  if (/\b3(?:[- .]?input|[- .]?ingång)/.test(text)) return 3;
  if (['nand','nor'].includes(gate) && /\btriple\b/.test(text)) return 3;
  return 2;
}

function _componentSymbol(c) {
  // Transistors
  const cat = ((c.category || {}).slug || '').toLowerCase();
  if (cat.includes('transistor')) {
    const tags = (c.tags || []).map(t => t.toLowerCase());
    const type = ((c.specs || {}).type || '').toUpperCase();
    if (tags.includes('darlington')) return {name:'darlington', label:null};
    if (tags.some(t => t.includes('mosfet') || t === 'fet') || (c.specs || {}).gate)
      return {name:'mosfet', label:null};
    if (type === 'NPN') return {name:'npn', label:null};
    if (type === 'PNP') return {name:'pnp', label:null};
    return null;
  }

  // Darlington arrays (ULN2003, ULN2803 etc.) – category-independent
  const text = [c.name, ...(c.tags || [])].join(' ').toLowerCase();
  if (text.includes('darlington') && text.includes('array')) {
    const count = (c.specs || {}).channels;
    return {name: 'darlington', label: count ? `x${count}` : null};
  }

  // Logic gates (no category restriction – rely on keywords + skip list)
  if (_SKIP.test(text)) return null;

  let gate = null;
  if (_hasGate(text, 'nand'))      gate = 'nand';
  else if (_hasGate(text, 'xnor')) gate = 'xnor';
  else if (_hasGate(text, 'xor'))  gate = 'xor';
  else if (_hasGate(text, 'nor'))  gate = 'nor';
  else if (_hasGate(text, 'and'))  gate = 'and';
  else if (/\binverter\b/.test(text)) gate = 'inverter';
  else if (/\bbuffer\b/.test(text))   gate = 'buffer';
  if (!gate) return null;

  let inputs = 2;
  if (['and','nand','nor','xor','xnor'].includes(gate)) {
    inputs = gate === 'xnor' ? 2 : _gateInputs(text, gate);
  }

  const count = /\boctal\b/.test(text) ? 8 : /\bhex\b/.test(text) ? 6 :
                /\bquad\b/.test(text) ? 4 : /\btriple\b/.test(text) ? 3 :
                /\bdual\b/.test(text) ? 2 : null;

  const svgName = ['and','nand','nor','xor','xnor'].includes(gate)
    ? `logic_${gate}_${inputs}in` : `logic_${gate}`;
  const label = count && count > 1 ? `x${count}` : null;
  return {name: svgName, label};
}

const heroEl   = document.getElementById('search-hero');
const chatView = document.getElementById('chat-view');
const exchanges= document.getElementById('chat-exchanges');
const statusEl = document.getElementById('status');
const errorEl  = document.getElementById('error-msg');

let conversationHistory = [];
let exchangeCount = 0;

// Switch from hero to chat view (once)
function _startChat() {
  heroEl.classList.add('d-none');
  chatView.classList.remove('d-none');
  document.getElementById('chat-input').focus();
}

function resetConversation() {
  conversationHistory = [];
  exchanges.innerHTML = '';
  errorEl.classList.add('d-none');
  chatView.classList.add('d-none');
  heroEl.classList.remove('d-none');
  document.getElementById('ask-input').value = '';
  document.getElementById('ask-input').focus();
}

// Shared search handler (used by hero form AND chat bar)
async function _doSearch(question) {
  if (!question) return;

  // First search: switch to chat view
  if (!chatView.classList.contains('d-none') === false) _startChat();
  if (heroEl.style.display !== 'none' && !chatView.classList.contains('d-none') === false)
    _startChat();
  if (heroEl.offsetParent !== null) _startChat();

  // Clear inputs
  document.getElementById('ask-input').value = '';
  document.getElementById('chat-input').value = '';

  // Disable buttons
  document.getElementById('search-btn').disabled = true;
  document.getElementById('chat-btn').disabled = true;
  errorEl.classList.add('d-none');
  statusEl.classList.remove('d-none');

  // Scroll to spinner
  statusEl.scrollIntoView({behavior: 'smooth', block: 'center'});

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, history: conversationHistory}),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    const data = await resp.json();

    // Build exchange block – split prose and tables so table sits just above cards
    const exId = `ex-${++exchangeCount}`;
    const cardsId = `cards-${exId}`;
    const tablesId = `tables-${exId}`;
    const tokenHtml = data.usage
      ? `<div class="text-secondary small text-end mt-2">${data.model ? data.model + ' &nbsp;·&nbsp; ' : ''}Tokens: ${fmt(data.usage.input_tokens)} in / ${fmt(data.usage.output_tokens)} ut</div>`
      : '';

    let proseHtml = '', tableBlockHtml = '';
    if (data.answer) {
      const tmp = document.createElement('div');
      tmp.innerHTML = formatAnswer(data.answer);
      const tableWrappers = tmp.querySelectorAll('.table-responsive');
      tableBlockHtml = Array.from(tableWrappers).map(t => { const h = t.outerHTML; t.remove(); return h; }).join('');
      proseHtml = tmp.innerHTML.trim();
    }

    const block = document.createElement('div');
    block.className = 'chat-exchange mb-4';
    block.id = exId;
    block.innerHTML = `
      <div class="d-flex justify-content-end mb-3">
        <div class="rounded-3 px-3 py-2 small"
             style="background:#b86010;color:#fff;max-width:80%;word-break:break-word">
          ${inlineFormat(question)}
        </div>
      </div>
      ${proseHtml ? `<div class="answer-box mb-3">${proseHtml}</div>` : ''}
      <div id="${tablesId}">${tableBlockHtml}</div>
      <div class="row g-3" id="${cardsId}"></div>
      ${tokenHtml}`;
    exchanges.appendChild(block);

    const cardsEl = document.getElementById(cardsId);
    const tablesEl = document.getElementById(tablesId);

    // Render drawers or components
    if (data.drawers && data.drawers.length > 0) {
      for (const d of data.drawers) {
        cardsEl.insertAdjacentHTML('beforeend', renderDrawerCard(d));
      }
    } else if (data.components && data.components.length > 0) {
      const byId = {};
      data.components.forEach(c => { byId[c.id] = c; });

      if (data.components.length <= 2) {
        // Few results: show cards directly
        for (const c of data.components) {
          cardsEl.insertAdjacentHTML('beforeend', await renderCard(c));
        }
      } else {
        // Many results: table-first, render card on row click
        linkTableRows(data.components, tablesEl, cardsEl, byId);
      }
    }

    // Update history
    conversationHistory.push({role: 'user', content: question});
    if (data.answer) conversationHistory.push({role: 'assistant', content: data.answer});

    // Scroll to bottom of new exchange
    requestAnimationFrame(() => block.scrollIntoView({behavior: 'smooth', block: 'end'}));

  } catch (err) {
    errorEl.textContent = 'Något gick fel: ' + err.message;
    errorEl.classList.remove('d-none');
  } finally {
    statusEl.classList.add('d-none');
    document.getElementById('search-btn').disabled = false;
    document.getElementById('chat-btn').disabled = false;
  }
}

// Hero form
document.getElementById('ask-form').addEventListener('submit', e => {
  e.preventDefault();
  _doSearch(document.getElementById('ask-input').value.trim());
});

// Chat bar button
document.getElementById('chat-btn').addEventListener('click', () => {
  _doSearch(document.getElementById('chat-input').value.trim());
});
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); _doSearch(document.getElementById('chat-input').value.trim()); }
});
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// Cabinet / browse drawers
async function _browseDrawers() {
  _startChat();
  document.getElementById('search-btn').disabled = true;
  document.getElementById('chat-btn').disabled = true;
  statusEl.classList.remove('d-none');
  try {
    const resp = await fetch('/api/drawers-overview');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const drawers = await resp.json();
    const exId = `ex-${++exchangeCount}`;
    const cardsId = `cards-${exId}`;
    const block = document.createElement('div');
    block.className = 'chat-exchange mb-4';
    block.id = exId;
    block.innerHTML = `<div class="row g-3" id="${cardsId}"></div>`;
    exchanges.appendChild(block);
    document.getElementById(cardsId).insertAdjacentHTML('beforeend', renderAllDrawersCard(drawers));
    requestAnimationFrame(() => block.scrollIntoView({behavior: 'smooth', block: 'start'}));
  } catch(err) {
    errorEl.textContent = 'Kunde inte hämta lådor: ' + err.message;
    errorEl.classList.remove('d-none');
  } finally {
    statusEl.classList.add('d-none');
    document.getElementById('search-btn').disabled = false;
    document.getElementById('chat-btn').disabled = false;
  }
}

document.getElementById('cabinet-btn').addEventListener('click', _browseDrawers);
document.getElementById('browse-btn').addEventListener('click', _browseDrawers);

function fmt(n) { return n.toLocaleString('sv'); }

function inlineFormat(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

function formatAnswer(text) {
  const lines = text.split('\n');
  const out = [];
  let tableRows = [];

  function flushTable() {
    if (!tableRows.length) return;
    let html = '<div class="table-responsive my-2"><table class="table table-sm table-hover mb-0 small answer-table">';
    tableRows.forEach((cells, i) => {
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag} class="py-1">${inlineFormat(c)}</${tag}>`).join('') + '</tr>';
    });
    html += '</table></div>';
    out.push(html);
    tableRows = [];
  }

  for (const raw of lines) {
    const line = raw.trim();
    if (/^\|/.test(line)) {
      if (/^[\|\s\-:]+$/.test(line)) continue; // separator row
      tableRows.push(line.split('|').slice(1, -1).map(c => {
        const v = c.trim();
        return /^[✗✘×\-–—]+$/.test(v) ? '' : v;
      }));
    } else {
      flushTable();
      if (/^##\s+/.test(line)) {
        out.push(`<p class="fw-semibold mb-1 mt-3">${inlineFormat(line.replace(/^##\s+/,''))}</p>`);
      } else if (/^#\s+/.test(line)) {
        out.push(`<p class="fw-bold mb-1 mt-2">${inlineFormat(line.replace(/^#\s+/,''))}</p>`);
      } else if (/^[-*]\s+/.test(line)) {
        out.push(`<div class="ms-2 mb-1">• ${inlineFormat(line.replace(/^[-*]\s+/,''))}</div>`);
      } else if (line === '') {
        out.push('<div class="mb-2"></div>');
      } else {
        out.push(`<p class="mb-1">${inlineFormat(line)}</p>`);
      }
    }
  }
  flushTable();
  return out.join('');
}

function linkTableRows(components, answerContainer, cardsContainer, componentLookupById) {
  if (!answerContainer) return;
  const lookup = {};
  components.forEach(c => {
    lookup[c.name.toLowerCase()] = c.id;
    if (c.part_number) lookup[c.part_number.toLowerCase()] = c.id;
  });

  answerContainer.querySelectorAll('.answer-table tr').forEach((row, i) => {
    if (i === 0) return;
    let matchId = null;
    row.querySelectorAll('td').forEach(td => {
      const t = td.textContent.trim().toLowerCase();
      if (lookup[t]) matchId = lookup[t];
    });
    if (!matchId) return;

    row.classList.add('row-linked');

    if (componentLookupById) {
      // On-demand mode: render card in cardsContainer on click
      row.title = 'Visa komponentkort';
      row.addEventListener('click', async () => {
        const tbody = row.closest('tbody');
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
        row.classList.add('table-active');

        const comp = componentLookupById[matchId];
        if (!comp) return;
        cardsContainer.innerHTML =
          '<div class="text-secondary small py-2"><span class="spinner-border spinner-border-sm me-2"></span>Laddar...</div>';
        cardsContainer.innerHTML = `<div class="row g-3">${await renderCard(comp)}</div>`;
        requestAnimationFrame(() => cardsContainer.scrollIntoView({behavior: 'smooth', block: 'end'}));
      });
    } else {
      // Scroll-to mode: card already rendered, just scroll + flash
      row.title = 'Hoppa till komponentkortet';
      row.addEventListener('click', () => {
        const target = cardsContainer
          ? cardsContainer.querySelector(`#comp-${matchId}`)
          : document.getElementById(`comp-${matchId}`);
        if (!target) return;
        target.scrollIntoView({behavior: 'smooth', block: 'center'});
        target.classList.remove('card-flash');
        void target.offsetWidth;
        target.classList.add('card-flash');
        setTimeout(() => target.classList.remove('card-flash'), 1500);
      });
    }
  });
}

function renderAllDrawersCard(drawers) {
  const rows = drawers.map(d => `
    <tr class="all-drawers-row" style="cursor:pointer" data-label="${d.label}">
      <td class="font-monospace fw-semibold py-1">${d.label}</td>
      <td class="py-1">${d.content_summary}</td>
      <td class="py-1 text-secondary small text-end">${d.component_count || ''}</td>
    </tr>`).join('');
  return `
    <div class="col-12" id="all-drawers-card">
      <div class="card result-card">
        <div class="card-body">
          <h5 class="fw-semibold mb-3"><i class="bi bi-collection me-2"></i>Kabinettets lådor</h5>
          <table class="table table-sm table-hover mb-0">
            <thead class="table-light">
              <tr><th>Låda</th><th>Innehåll</th><th class="text-end">Komponenter</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <div id="all-drawers-detail" class="mt-3"></div>
        </div>
      </div>
    </div>`;
}

document.addEventListener('click', async e => {
  const row = e.target.closest('.all-drawers-row');
  if (!row) return;
  const label = row.dataset.label;
  const detailEl = document.getElementById('all-drawers-detail');
  if (!detailEl) return;

  const tbody = row.closest('tbody');
  tbody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
  row.classList.add('table-active');

  detailEl.innerHTML = '<div class="text-secondary small py-2"><span class="spinner-border spinner-border-sm me-2"></span>Hämtar...</div>';

  try {
    const resp = await fetch(`/api/drawers/${label}/summary`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    detailEl.innerHTML = `<div class="row g-3">${renderDrawerCard(data)}</div>`;
    requestAnimationFrame(() => detailEl.scrollIntoView({behavior:'smooth', block:'start'}));
  } catch(err) {
    detailEl.innerHTML = `<p class="text-danger small">Kunde inte ladda: ${err.message}</p>`;
  }
});

function renderDrawerCard(d) {
  const photoHtml = d.photos && d.photos.length > 0
    ? `<a href="/files/${d.photos[0].filepath}" target="_blank">
         <img src="/files/${d.photos[0].filepath}" class="img-fluid rounded mb-3"
              style="width:100%;height:auto;cursor:zoom-in" alt="Foto ${d.label}">
       </a>`
    : '';

  const detailId = `drawer-detail-${d.id}`;

  const rows = (d.compartments || []).map(c => {
    const dsIcon = c.datasheet_path
      ? `<a href="/files/${c.datasheet_path}" target="_blank" onclick="event.stopPropagation()"
            class="text-success" title="Datablad finns">
           <i class="bi bi-check-lg"></i>
         </a>`
      : '';
    return `
    <tr class="drawer-comp-row" style="cursor:pointer"
        data-component-id="${c.component_id}" data-detail="${detailId}">
      <td class="font-monospace fw-semibold py-1">${c.label}</td>
      <td class="py-1">${c.component_name}</td>
      <td class="py-1 small">${c.description || ''}</td>
      <td class="py-1 text-end">${dsIcon}</td>
    </tr>`;
  }).join('');

  const tableHtml = rows
    ? `<table class="table table-sm table-hover mb-0">
        <thead class="table-light">
          <tr><th>Fack</th><th>Komponent</th><th>Beskrivning</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
       </table>`
    : '<p class="text-secondary small mb-0">Inga komponenter registrerade.</p>';

  return `
    <div class="col-12">
      <div class="card result-card">
        <div class="card-body">
          <h5 class="fw-semibold mb-2">
            <i class="bi bi-box me-1"></i>${d.label}
            ${d.description ? `<span class="text-secondary fw-normal fs-6 ms-2">${d.description}</span>` : ''}
          </h5>
          ${photoHtml}
          ${tableHtml}
          <div id="${detailId}" class="mt-3"></div>
        </div>
      </div>
    </div>`;
}

async function _handleDrawerRowClick(e) {
  const row = e.currentTarget;
  const compId = row.dataset.componentId;
  const detailId = row.dataset.detail;
  const detailEl = document.getElementById(detailId);
  if (!detailEl) return;

  // Highlight selected row
  const tbody = row.closest('tbody');
  tbody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
  row.classList.add('table-active');

  detailEl.innerHTML = '<div class="text-secondary small py-2"><span class="spinner-border spinner-border-sm me-2"></span>Laddar...</div>';

  try {
    const resp = await fetch(`/api/components/${compId}/card`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const comp = await resp.json();
    detailEl.innerHTML = `<div class="row g-3">${await renderCard(comp)}</div>`;
    // Scroll so the bottom of the card (rounded corners) is visible
    requestAnimationFrame(() => {
      detailEl.scrollIntoView({behavior: 'smooth', block: 'end'});
    });
  } catch (err) {
    detailEl.innerHTML = `<p class="text-danger small">Kunde inte ladda: ${err.message}</p>`;
  }
}

// Delegate click events for drawer rows (works after dynamic insertion)
document.addEventListener('click', e => {
  const row = e.target.closest('.drawer-comp-row');
  if (row) _handleDrawerRowClick({currentTarget: row});
});

function _packageValue(c) {
  const specs = c.specs || {};
  return specs.package || specs.Package || specs.pkg || null;
}

function _packageSymbolName(c) {
  const raw = _packageValue(c);
  if (!raw) return null;
  const pkg = String(raw).trim().toUpperCase();
  const normalized = pkg.replace(/\s+/g, '-');
  const dip = normalized.match(/^P?DIP-?(\d+)$/);
  if (dip) return `package_dip_${dip[1]}`;
  if (normalized === 'DIP' || normalized === 'PDIP') return 'package_dip';
  const so = normalized.match(/^(?:SO|SOP|SOIC|TSSOP|SSOP)-?(\d+)$/);
  if (so) return `package_so_${so[1]}`;
  const to = normalized.match(/^TO-?(\d+)$/);
  if (to) return `package_to_${to[1]}`;
  return null;
}

async function _packageIcon(c) {
  const pkg = _packageValue(c);
  if (!pkg) return '';
  const svg = await _packageSvg(_packageSymbolName(c));
  if (!svg) return '';
  return `<div class="package-symbol" title="${pkg}" style="width:76px;height:90px;flex-shrink:0;opacity:0.82">${svg}</div>`;
}

async function renderCard(c) {
  const datasheet = (c.files || []).find(f => f.file_type === 'datasheet');
  const pdfBtn = datasheet
    ? `<a href="/files/${datasheet.filepath}" target="_blank"
          class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 text-nowrap">
         <i class="bi bi-file-earmark-pdf-fill"></i> Datablad
       </a>`
    : '';

  const mfr = [c.manufacturer, c.part_number].filter(Boolean).join(' · ');

  const catBadge = c.category
    ? `<span class="badge" style="background:var(--accent-glow,rgba(253,126,20,.18));color:var(--accent,#fd7e14);border:1px solid rgba(253,126,20,.35)">${c.category.name}</span>`
    : '';

  const sym = _componentSymbol(c);
  const svg = sym ? await _symbolSvg(sym.name) : null;
  const symHtml = sym && svg
    ? `<div class="d-flex align-items-center gap-2" style="flex-shrink:0;opacity:0.85">
         <div class="component-symbol" style="width:90px;height:90px">${svg}</div>
         ${sym.label ? `<span class="fw-semibold text-secondary" style="font-size:1rem;line-height:1">${sym.label}</span>` : ''}
       </div>`
    : '';
  const packageHtml = await _packageIcon(c);
  const visualHtml = packageHtml || symHtml
    ? `<div class="d-flex align-items-center gap-2 ms-3" style="flex-shrink:0">${packageHtml}${symHtml}</div>`
    : '';

  const specs = Object.entries(c.specs || {});
  const specsHtml = specs.length
    ? `<div class="d-flex align-items-start">
        <div class="specs-grid mt-2 mb-1 flex-grow-1">
          ${specs.map(([k,v]) =>
            `<span class="specs-key">${k}</span><span class="specs-val">${v}</span>`
          ).join('')}
        </div>
        ${visualHtml}
       </div>`
    : visualHtml ? `<div class="mt-2 d-flex justify-content-end">${visualHtml}</div>` : '';

  const stockHtml = (c.stock || []).length
    ? (c.stock || []).map(s => {
        const loc = [s.drawer, s.compartment].filter(Boolean).join(' › ');
        return `<span class="badge bg-success bg-opacity-75 me-1" style="font-size:1rem;padding:0.4em 0.7em"><i class="bi bi-box me-1"></i>${loc || '–'}</span>`;
      }).join('')
    : `<span class="text-secondary small">Inget lager registrerat</span>`;

  const tagsHtml = (c.tags || []).map(t =>
    `<span class="badge rounded-pill border border-secondary text-body fw-normal me-1 mb-1">${t}</span>`
  ).join('');

  return `
    <div class="col-12" id="comp-${c.id}">
      <div class="card result-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div class="flex-grow-1 min-width-0">
              <h5 class="mb-0 d-flex align-items-center gap-2 flex-wrap">
                <a href="/components/${c.id}" class="text-decoration-none text-body-emphasis fw-semibold">${c.name}</a>
                ${catBadge}
              </h5>
              ${mfr ? `<div class="text-secondary small mt-1">${mfr}</div>` : ''}
            </div>
            ${pdfBtn ? `<div class="flex-shrink-0">${pdfBtn}</div>` : ''}
          </div>
          ${c.description ? `<p class="small mt-2 mb-1">${c.description}</p>` : ''}
          ${specsHtml}
          <div class="mt-2">${stockHtml}</div>
          ${tagsHtml ? `<div class="mt-2">${tagsHtml}</div>` : ''}
        </div>
      </div>
    </div>`;
}
</script>
{% endblock %}
