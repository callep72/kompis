<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <style>
      .line { fill: none; stroke: currentColor; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; }
      .arrow { fill: currentColor; }
    </style>
  </defs>

  <circle class="line" cx="540" cy="520" r="300"/>

  <!-- Gate -->
  <line class="line" x1="95" y1="540" x2="420" y2="540"/>
  <line class="line" x1="500" y1="360" x2="500" y2="670"/>

  <!-- Channel and terminals -->
  <polyline class="line" points="635,260 635,360 610,360 610,700 635,700 635,835"/>
  <line class="line" x1="635" y1="90" x2="635" y2="260"/>
  <line class="line" x1="635" y1="835" x2="635" y2="960"/>

  <!-- Arrow (same stylized direction as generated example) -->
  <polygon class="arrow" points="585,650 635,690 635,640"/>

  <!-- Labels -->
  <text class="label" x="130" y="498">G</text>
  <text class="label" x="690" y="150">D</text>
  <text class="label" x="690" y="915">S</text>
</svg>
