<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <style>
      .line { fill: none; stroke: currentColor; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; }
      .arrow { fill: currentColor; }
    </style>
  </defs>

  <circle class="line" cx="540" cy="520" r="300"/>

  <!-- Base -->
  <line class="line" x1="95" y1="520" x2="415" y2="520"/>
  <line class="line" x1="415" y1="360" x2="415" y2="680"/>

  <!-- Internal branches -->
  <line class="line" x1="415" y1="475" x2="735" y2="220"/>
  <line class="line" x1="415" y1="585" x2="735" y2="835"/>

  <!-- External leads -->
  <line class="line" x1="735" y1="220" x2="735" y2="90"/>
  <line class="line" x1="735" y1="835" x2="735" y2="960"/>

  <!-- NPN arrow on emitter, pointing outward -->
  <polygon class="arrow" points="640,300 700,357 680,291"/>

  <!-- Labels -->
  <text class="label" x="125" y="468">B</text>
  <text class="label" x="790" y="178">E</text>
  <text class="label" x="790" y="915">C</text>
</svg>
