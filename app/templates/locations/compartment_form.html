{% extends "base.html" %}
{% block title %}Nytt fack – KOMPIS{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/locations">Platser</a></li>
        <li class="breadcrumb-item active">Nytt fack</li>
    </ol>
</nav>

<div class="row">
    <div class="col-md-6">
        <h1 class="h3 mb-4">Nytt fack</h1>
        <form method="post" action="/locations/compartments/new">
            <input type="hidden" name="drawer_id" value="{{ drawer_id or '' }}">
            <div class="mb-3">
                <label class="form-label">Låda <span class="text-danger">*</span></label>
                <select name="drawer_id_select" class="form-select" id="drawerSelect" onchange="document.querySelector('[name=drawer_id]').value=this.value">
                    <option value="">Välj låda…</option>
                    {% for d in drawers %}
                    <option value="{{ d.id }}" {% if d.id == drawer_id|int %}selected{% endif %}>{{ d.label }}{% if d.description %} – {{ d.description }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Facknummer <span class="text-danger">*</span></label>
                <input type="text" name="label" class="form-control font-monospace" required placeholder="F0001">
                <div class="form-text">Globalt unikt löpnummer, t.ex. F0001.</div>
            </div>
            <div class="mb-4">
                <label class="form-label">Beskrivning</label>
                <textarea name="description" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Skapa fack</button>
                <a href="/locations" class="btn btn-outline-secondary">Avbryt</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
