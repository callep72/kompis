{% extends "base.html" %}
{% block title %}Ny låda – KOMPIS{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/locations">Platser</a></li>
        <li class="breadcrumb-item active">Ny låda</li>
    </ol>
</nav>

<div class="row">
    <div class="col-md-6">
        <h1 class="h3 mb-4">Ny låda</h1>
        <form method="post" action="/locations/drawers/new">
            <div class="mb-3">
                <label class="form-label">Beteckning <span class="text-danger">*</span></label>
                <input type="text" name="label" class="form-control font-monospace" required placeholder="L01">
                <div class="form-text">T.ex. L01, L02, …</div>
            </div>
            <div class="mb-4">
                <label class="form-label">Beskrivning</label>
                <textarea name="description" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Skapa låda</button>
                <a href="/locations" class="btn btn-outline-secondary">Avbryt</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
