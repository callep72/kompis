<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <style>
      .line { fill: none; stroke: currentColor; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; }
      .arrow { fill: currentColor; }
    </style>
  </defs>

  <circle class="line" cx="540" cy="520" r="300"/>

  <!-- Base lead and first transistor base -->
  <line class="line" x1="95" y1="520" x2="355" y2="520"/>
  <line class="line" x1="355" y1="360" x2="355" y2="640"/>

  <!-- First transistor collector to common collector -->
  <polyline class="line" points="355,470 500,350 720,350"/>

  <!-- First transistor emitter to second transistor base -->
  <polyline class="line" points="355,570 470,680 615,680"/>

  <!-- Second transistor base -->
  <line class="line" x1="615" y1="545" x2="615" y2="785"/>

  <!-- Second transistor collector to common collector -->
  <line class="line" x1="615" y1="610" x2="720" y2="520"/>

  <!-- Second transistor emitter to emitter terminal -->
  <line class="line" x1="615" y1="730" x2="720" y2="825"/>

  <!-- Common collector terminal -->
  <line class="line" x1="720" y1="350" x2="720" y2="90"/>
  <line class="line" x1="720" y1="350" x2="720" y2="520"/>

  <!-- Emitter terminal -->
  <line class="line" x1="720" y1="825" x2="720" y2="960"/>

  <!-- Arrows -->
  <polygon class="arrow" points="435,648 470,680 446,630"/>
  <polygon class="arrow" points="670,780 718,825 690,764"/>

  <!-- Labels -->
  <text class="label" x="125" y="468">B</text>
  <text class="label" x="775" y="135">C</text>
  <text class="label" x="775" y="915">E</text>
</svg>
