<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Monochrome line art SVG of a cabinet with 15 drawers">
  <title>Cabinet with 15 drawers - light line art</title>
  <desc>Transparent-background monochrome vector drawing of a tall cabinet with exactly 15 horizontal drawers.</desc>
  <defs>
    <style><![CDATA[
      .line { fill: none; stroke: #e8e8e8; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
